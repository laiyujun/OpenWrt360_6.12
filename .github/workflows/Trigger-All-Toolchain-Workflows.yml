name: Trigger-All-Toolchain-Workflows  # 主要工作流的名称

on:
  workflow_dispatch:  # 手动触发：通过 GitHub UI 来触发
  schedule:
    - cron: 42 18 * * 4  # 北京时间周四18:42计划，反向提前5.5h抵消延迟，预期实际周五约00:12
      timezone: 'Asia/Shanghai'

jobs:

  IPQ60XX-6_12-Libwrt:
    uses: ./.github/workflows/Compile-Toolchain.yml
    with:
      WRT_TARGET: 'IPQ60XX'
      WRT_SOURCE: 'LiBwrt/LibWrt'
      WRT_BRANCH: '25.12-nss'

  IPQ807X-6_12-Libwrt:
    uses: ./.github/workflows/Compile-Toolchain.yml
    with:
      WRT_TARGET: 'IPQ807X'
      WRT_SOURCE: 'LiBwrt/LibWrt'
      WRT_BRANCH: '25.12-nss'

  IPQ53XX-6_18-Immortalwrt:
    uses: ./.github/workflows/Compile-Toolchain.yml
    with:
      WRT_TARGET: 'IPQ53XX'
      WRT_SOURCE: 'VIKINGYFY/immortalwrt'
      WRT_BRANCH: 'owrt'

  x86-64-6_18-Immortalwrt:
    uses: ./.github/workflows/Compile-Toolchain.yml
    with:
      WRT_TARGET: 'x86-64'
      WRT_SOURCE: 'immortalwrt/immortalwrt'
      WRT_BRANCH: 'master'

  # 补齐固件工作流需要、但此前未预编译的工具链缓存：
  # JDCloud(immortalwrt master) 与 x86-64 同源码分支但平台为 qualcommax/ipq60xx，缓存键不同；
  # 该缓存同时被 JDCloud-6_12-immortalwrt 与 JDCloud-6_12-immortalwrt-NoWiFi 两个固件 job 读取
  # （WiFi 选项不进入缓存键，故只需一个 job）。
  IPQ60XX-6_18-Immortalwrt:
    uses: ./.github/workflows/Compile-Toolchain.yml
    with:
      WRT_TARGET: 'IPQ60XX'
      WRT_SOURCE: 'immortalwrt/immortalwrt'
      WRT_BRANCH: 'master'

  # MT798x 与 IPQ53XX 同源码分支(VIKINGYFY/owrt)但平台为 mediatek/filogic，缓存键不同；
  # MT798x-filogic-VIKINGYFY 固件 job 需读取此缓存。
  MT798x-6_18-Immortalwrt:
    uses: ./.github/workflows/Compile-Toolchain.yml
    with:
      WRT_TARGET: 'MT798x'
      WRT_SOURCE: 'VIKINGYFY/immortalwrt'
      WRT_BRANCH: 'owrt'

  Delete-Old-Workflows:
    uses: ./.github/workflows/Delete-Old-Workflows.yml
